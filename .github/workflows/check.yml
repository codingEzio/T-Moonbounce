name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: '0'
      GOMAXPROCS: '4'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l *.go)"
      - run: go test ./... -count=1
      - run: go vet ./...
      - name: Build and verify app
        run: ./package
